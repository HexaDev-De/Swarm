name: "Release Swarm"

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: "Build ${{ matrix.platform }} (${{ matrix.target }})"
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon / ARM64
            target: 'aarch64-apple-darwin'
            bundle: 'dmg'
          - platform: 'windows-latest' # Windows x64
            target: 'x86_64-pc-windows-msvc'
            bundle: 'nsis'
          - platform: 'ubuntu-22.04' # Linux x64
            target: 'x86_64-unknown-linux-gnu'
            bundle: 'appimage'

    runs-on: ${{ matrix.platform }}
    env:
      NO_STRIP: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Dependencies
        run: npm ci

      - name: Build Tauri Frontend & Rust Binary
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Swarm v__VERSION__'
          releaseBody: 'See release notes in releases/__VERSION__.md or README.md. Download the native desktop client for macOS, Windows, or Linux below.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Standardize Artifacts & Checksums
        run: node scripts/release/standardize-artifacts.mjs ${{ matrix.platform }}

      - name: Upload Standardized Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: dist-artifacts/*

  publish:
    name: "Publish Full Release Suite & latest.json"
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download All Standardized Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-suite
          merge-multiple: true

      - name: Generate latest.json Manifest
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          node scripts/release/generate-latest-manifest.mjs release-suite "$VERSION"

      - name: Inject Dynamic Release Notes & Upload Suite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Finalizing release for $TAG (v$VERSION)..."

          NOTES_FILE="releases/${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="README.md"
          fi

          echo "Using release notes from $NOTES_FILE"
          gh release edit "$TAG" --notes-file "$NOTES_FILE" || gh release create "$TAG" --title "Swarm $TAG" --notes-file "$NOTES_FILE"

          cd release-suite
          ls -la
          for file in *; do
            if [ -f "$file" ] && [ -s "$file" ]; then
              echo "Uploading $file..."
              gh release upload "$TAG" "$file" --clobber
            fi
          done
